<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images/Logo.jpeg" type="image/x-icon">
    <title>blood warriors</title>
</head>
<body>
    <marquee behavior="" direction="">রক্তদান এবং গ্রহনের ক্ষেত্রে যেকোনো ধরণের আর্থিক লেনদেন থেকে বিরত থাকুন !</marquee>
    <div id="hero">
        <div class="logo">
            <img src="images/Logo.jpeg" alt="">
        </div>
        <div class="title">
            <h1>Blood Warriors</h1>
        </div>
    </div>
    <div id="group">
        <p>আপনার কাঙ্খিত রক্তের গ্রুপ নির্বাচন করুন</p>
        <div class="groups">
            <div id="A+">A+</div>
            <div id="B+">B+</div>
            <div id="O+">O+</div>
            <div id="AB+">AB+</div>
            <div id="A-">A-</div>
            <div id="B-">B+</div>
            <div id="AB-">AB-</div>
            <div id="O-">O-</div>
        </div>
    </div>
</body>
</html>
